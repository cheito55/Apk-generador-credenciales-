          const D = m ^ E;
          m = U;
          U = D;
        }
        T = m; m = U; U = T;

        for (let _ = 0; _ < 128; _ += 8) {
          const I = SP[0][(((1 & U) << 5) | (U >>> 27)) ^ i[_]] ^
                    SP[1][((U >>> 23) & 63) ^ i[_ + 1]] ^
                    SP[2][((U >>> 19) & 63) ^ i[_ + 2]] ^
                    SP[3][((U >>> 15) & 63) ^ i[_ + 3]] ^
                    SP[4][((U >>> 11) & 63) ^ i[_ + 4]] ^
                    SP[5][((U >>> 7) & 63) ^ i[_ + 5]] ^
                    SP[6][((U >>> 3) & 63) ^ i[_ + 6]] ^
                    SP[7][(((31 & U) << 1) | (U >>> 31)) ^ i[_ + 7]];
          const O = m ^ I;
          m = U;
          U = O;
        }

        const k = U >>> 24, q = (U >>> 16) & 255, P = (U >>> 8) & 255, H = 255 & U;
        const K = m >>> 24, M = (m >>> 16) & 255, N = (m >>> 8) & 255, R = 255 & m;
        const L = FP_HI[0][k] | FP_HI[1][q] | FP_HI[2][P] | FP_HI[3][H] | FP_HI[4][K] | FP_HI[5][M] | FP_HI[6][N] | FP_HI[7][R];
        const V = FP_LO[0][k] | FP_LO[1][q] | FP_LO[2][P] | FP_LO[3][H] | FP_LO[4][K] | FP_LO[5][M] | FP_LO[6][N] | FP_LO[7][R];

        c[l] = L >>> 24;
        c[l + 1] = (L >>> 16) & 255;
        c[l + 2] = (L >>> 8) & 255;
        c[l + 3] = 255 & L;
        c[l + 4] = V >>> 24;
        c[l + 5] = (V >>> 16) & 255;
        c[l + 6] = (V >>> 8) & 255;
        c[l + 7] = 255 & V;
      }
      return c;
    }

    const DEFAULT_3DES_KEY = hexToBytes("e7af1ed7de1ffddd7bd3fe37ebdffde9ef3fe1ae39edfeb8");

    function wrap(str) {
      const plainBytes = new TextEncoder().encode(str);
      const padLen = 8 - (plainBytes.length % 8);
      const padded = new Uint8Array(plainBytes.length + padLen);
      padded.set(plainBytes);
      for (let i = plainBytes.length; i < padded.length; i++) padded[i] = padLen;
      const encrypted = runFast3DES(padded, DEFAULT_3DES_KEY, false);
      return bytesToHex(new TextEncoder().encode(b64encode(encrypted)));
    }

    function unwrap(hexStr) {
      const b64 = new TextDecoder("utf-8").decode(hexToBytes(hexStr));
      const decrypted = runFast3DES(b64decode(b64), DEFAULT_3DES_KEY, true);
      if (!decrypted.length) return "";
      const pad = decrypted[decrypted.length - 1];
      const actualLen = pad >= 1 && pad <= 8 ? decrypted.length - pad : decrypted.length;
      return new TextDecoder("utf-8").decode(decrypted.subarray(0, actualLen));
    }

    function md5(string) {
      function cmn(q, a, b, x, s, t) {
        a = (a + q + x + t) & 0xFFFFFFFF;
        return (((a << s) | (a >>> (32 - s))) + b) & 0xFFFFFFFF;
      }
      function ff(a, b, c, d, x, s, t) { return cmn((b & c) | ((~b) & d), a, b, x, s, t); }
      function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & (~d)), a, b, x, s, t); }
      function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
      function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | (~d)), a, b, x, s, t); }

      const n = string.length;
      const state = [1732584193, -271733879, -1732584194, 271733878];
      let i;
      for (i = 64; i <= n; i += 64) {
        cycle(state, blk(string.substring(i - 64, i)));
      }
      const rem = string.substring(i - 64);
      const tail = new Array(16).fill(0);
      for (i = 0; i < rem.length; i++) tail[i >> 2] |= rem.charCodeAt(i) << ((i % 4) << 3);
      tail[i >> 2] |= 0x80 << ((i % 4) << 3);
      if (i > 55) {
        cycle(state, tail);
        for (i = 0; i < 16; i++) tail[i] = 0;
      }
      tail[14] = n * 8;
      cycle(state, tail);

      function cycle(x, k) {
        let a = x[0], b = x[1], c = x[2], d = x[3];
        a = ff(a, b, c, d, k[0], 7, -680876936); d = ff(d, a, b, c, k[1], 12, -389564586); c = ff(c, d, a, b, k[2], 17, 606105819); b = ff(b, c, d, a, k[3], 22, -1044525330);
        a = ff(a, b, c, d, k[4], 7, -176418897); d = ff(d, a, b, c, k[5], 12, 1200080426); c = ff(c, d, a, b, k[6], 17, -1473231341); b = ff(b, c, d, a, k[7], 22, -45705983);
        a = ff(a, b, c, d, k[8], 7, 1770035416); d = ff(d, a, b, c, k[9], 12, -1958414417); c = ff(c, d, a, b, k[10], 17, -42063); b = ff(b, c, d, a, k[11], 22, -1990404162);
        a = ff(a, b, c, d, k[12], 7, 1804603682); d = ff(d, a, b, c, k[13], 12, -40341101); c = ff(c, d, a, b, k[14], 17, -1502002290); b = ff(b, c, d, a, k[15], 22, 1236535329);

        a = gg(a, b, c, d, k[1], 5, -165796510); d = gg(d, a, b, c, k[6], 9, -1069501632); c = gg(c, d, a, b, k[11], 14, 643717713); b = gg(b, c, d, a, k[0], 20, -373897302);
        a = gg(a, b, c, d, k[5], 5, -701558691); d = gg(d, a, b, c, k[10], 9, 38016083); c = gg(c, d, a, b, k[15], 14, -660478335); b = gg(b, c, d, a, k[4], 20, -405537848);
        a = gg(a, b, c, d, k[9], 5, 568446438); d = gg(d, a, b, c, k[14], 9, -1019803690); c = gg(c, d, a, b, k[3], 14, -187363961); b = gg(b, c, d, a, k[8], 20, 1163531501);
        a = gg(a, b, c, d, k[13], 5, -1444681467); d = gg(d, a, b, c, k[2], 9, -51403784); c = gg(c, d, a, b, k[7], 14, 1735328473); b = gg(b, c, d, a, k[12], 20, -1926607734);

        a = hh(a, b, c, d, k[5], 4, -378558); d = hh(d, a, b, c, k[8], 11, -2022574463); c = hh(c, d, a, b, k[11], 16, 1839030562); b = hh(b, c, d, a, k[14], 23, -35309556);
        a = hh(a, b, c, d, k[1], 4, -1530992060); d = hh(d, a, b, c, k[4], 11, 1272893353); c = hh(c, d, a, b, k[7], 16, -155497632); b = hh(b, c, d, a, k[10], 23, -1094730640);
        a = hh(a, b, c, d, k[13], 4, 681279174); d = hh(d, a, b, c, k[0], 11, -358537222); c = hh(c, d, a, b, k[3], 16, -722521979); b = hh(b, c, d, a, k[6], 23, 76029189);
        a = hh(a, b, c, d, k[9], 4, -640364487); d = hh(d, a, b, c, k[12], 11, -421815835); c = hh(c, d, a, b, k[15], 16, 530742520); b = hh(b, c, d, a, k[2], 23, -995338651);

        a = ii(a, b, c, d, k[0], 6, -198630844); d = ii(d, a, b, c, k[7], 10, 1126891415); c = ii(c, d, a, b, k[14], 15, -1416354905); b = ii(b, c, d, a, k[5], 21, -57434055);
        a = ii(a, b, c, d, k[12], 6, 1700485571); d = ii(d, a, b, c, k[3], 10, -1894986606); c = ii(c, d, a, b, k[10], 15, -1051523); b = ii(b, c, d, a, k[1], 21, -2054922799);
        a = ii(a, b, c, d, k[8], 6, 1873313359); d = ii(d, a, b, c, k[15], 10, -30611744); c = ii(c, d, a, b, k[6], 15, -1560198380); b = ii(b, c, d, a, k[13], 21, 1309151649);
        a = ii(a, b, c, d, k[4], 6, -145523070); d = ii(d, a, b, c, k[11], 10, -1120210379); c = ii(c, d, a, b, k[2], 15, 718787259); b = ii(b, c, d, a, k[9], 21, -343485551);

        x[0] = (x[0] + a) & 0xFFFFFFFF;
        x[1] = (x[1] + b) & 0xFFFFFFFF;
        x[2] = (x[2] + c) & 0xFFFFFFFF;
        x[3] = (x[3] + d) & 0xFFFFFFFF;
      }

      function blk(s) {
        const b = new Array(16).fill(0);
        for (let i = 0; i < 64; i += 4) {
          b[i >> 2] = s.charCodeAt(i) + (s.charCodeAt(i + 1) << 8) + (s.charCodeAt(i + 2) << 16) + (s.charCodeAt(i + 3) << 24);
        }
        return b;
      }

      let out = "";
      for (let j = 0; j < 4; j++) {
        for (let k = 0; k < 4; k++) {
          out += HEX_CHARS[(state[j] >> (k * 8 + 4)) & 0x0F] + HEX_CHARS[(state[j] >> (k * 8)) & 0x0F];
        }
      }
      return out;
    }

    function extractPortalData(json) {
      let data = (json && (json.res || json.data)) || null;
      if (typeof data === "string" && data.length > 16 && /^[0-9a-fA-F]+$/i.test(data)) {
        try { data = JSON.parse(unwrap(data)); } catch { data = unwrap(data); }
      }
      return data;
    }

    // ==========================================
    // INTERFAZ Y LÓGICA DE DONACIÓN + MONITOR
    // ==========================================
    function mostrarMensaje(tipo, texto) {
      const box = document.getElementById("status-box");
      box.className = `status-box show status-${tipo}`;
      box.textContent = texto;
    }

    function formatearVidaRestante(minutos) {
      if (minutos <= 0) return "Vencida";
      const h = Math.floor(minutos / 60);
      const m = minutos % 60;
      return h > 0 ? `${h}h ${m}m restantes` : `${m}m restantes`;
    }

    function renderizarListaPool(lista) {
      const countEl = document.getElementById("pool-count");
      const listEl = document.getElementById("pool-list");
      countEl.textContent = lista.length;

      if (!lista.length) {
        listEl.innerHTML = `<div class="empty-msg">No hay credenciales vigentes en el Worker.<br>Enciende la VPN y presiona el botón de arriba.</div>`;
        return;
      }

      listEl.innerHTML = lista.map((item, idx) => {
        const claseVida = item.expiresInMinutes < 60
          ? "life-err"
          : (item.expiresInMinutes < 150 ? "life-warn" : "life-ok");

        return `
          <div class="pool-item">
            <div class="pool-left">
              <div class="uid-row">
                <span class="uid-code">${item.userId}</span>
                <span class="tag">${item.donorCountry || "XX"}</span>
                ${idx === 0 ? '<span class="tag tag-active">Activa</span>' : ''}
              </div>
              <div class="sub-meta">Cargada hace ${item.ageMinutes} min</div>
            </div>
            <div class="pool-right">
              <div class="life-text ${claseVida}">${formatearVidaRestante(item.expiresInMinutes)}</div>
              <button type="button" class="btn-del" onclick="borrarCredencial('${item.userId}', this)">Borrar</button>
            </div>
          </div>
        `;
      }).join("");
    }

    async function cargarPoolVigente() {
      const btn = document.getElementById("btn-refresh");
      const badge = document.getElementById("region-badge");
      btn.disabled = true;
      btn.textContent = "...";

      try {
        const res = await nativeFetch(`${WORKER_BASE}/session/current`, { cache: "no-store" });
        const data = await res.json();
        const country = data?.region?.country || "XX";
        const blocked = Boolean(data?.region?.isBlockedRegion);

        badge.className = `badge ${blocked ? "badge-blocked" : "badge-ok"}`;
        badge.textContent = blocked ? `${country} · Bloqueado (Usa VPN)` : `${country} · VPN Activa`;

        const lista = Array.isArray(data?.activeSessions) ? data.activeSessions : [];
        renderizarListaPool(lista);
      } catch (err) {
        badge.className = "badge badge-blocked";
        badge.textContent = "Sin conexión";
        mostrarMensaje("err", "No se pudo consultar el Worker: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Actualizar";
      }
    }

    async function borrarCredencial(userId, btnEl) {
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.textContent = "...";
      }
      try {
        await nativeFetch(`${WORKER_BASE}/session/fallback?exclude=${encodeURIComponent(userId)}&invalidate=1`, {
          cache: "no-store"
        });
        mostrarMensaje("info", `Credencial ${userId} eliminada del pool.`);
        await cargarPoolVigente();
      } catch (err) {
        mostrarMensaje("err", "Error al borrar: " + err.message);
      }
    }

    async function generarYDonar() {
      const btn = document.getElementById("btn-donate");
      btn.disabled = true;
      btn.textContent = "Generando credencial...";
      mostrarMensaje("info", "1/3 Creando identidad virtual nueva...");

      try {
        const drmId = randomBase64(32);
        const androidId = randomHex(8);

        const baseFields = {
          loginType: "2",
          appLanguage: "en",
          apkVersion: PORTAL_CONFIG.apkVersion,
          sysVersion: PORTAL_CONFIG.sysVersion,
          appId: PORTAL_CONFIG.appId,
          hardwareInfo: PORTAL_CONFIG.hardwareInfo,
          model: PORTAL_CONFIG.model,
          product: PORTAL_CONFIG.product,
          cpu: PORTAL_CONFIG.cpu,
          B29: "",
          reserve1: PORTAL_CONFIG.reserve1,
          deviceToken: "",
          drmId,
          sdkVer: PORTAL_CONFIG.sdkVer,
          sn: ""
        };

        const headers = {
          "Content-Type": "application/json; charset=utf-8",
          "apk": PORTAL_CONFIG.appId,
          "apkVer": PORTAL_CONFIG.apkHeaderVersion,
          "spkgVer": PORTAL_CONFIG.sysVersion
        };

        let credencial = null;
        let ultimoError = "No se pudo conectar con los servidores del portal.";

        for (const host of PORTAL_HOSTS) {
          try {
            mostrarMensaje("info", `2/3 Activando en ${host} (vía red nativa)...`);

            const snBody = JSON.stringify({
              userId: "",
              userToken: "",
              portalCode: PORTAL_CONFIG.portalCode,
              ...baseFields,
              androidId,
              wifiMac: "02:00:00:00:00:00",
              etheMac: "02:00:00:00:00:00",
              serialNumber: "unknown",
              diskInfo: "",
              ramSize: "",
              romSize: "",
              gatewayMac: "02:00:00:00:00:00",
              cpuAbi: PORTAL_CONFIG.cpu,
              display: PORTAL_CONFIG.product,
              brand: "SmartTV",
              verId: "",
              cpuId: "",
              hardware: PORTAL_CONFIG.hardwareInfo,
              manufacturer: "",
              fingerprint: "",
              host: "",
              device: PORTAL_CONFIG.product,
              board: "",
              tags: ""
            });

            const snRes = await nativeFetch(`https://${host}/api/portalCore/v3/snToken`, {
              method: "POST",
              headers,
              body: wrap(snBody)
            });
            const snJson = await snRes.json();
            const rawSn = JSON.stringify(snJson);
            if (/portal100024|黑名单/i.test(rawSn)) {
              throw new Error("Bloqueo regional (portal100024). Enciende una VPN fuera de Argentina e intenta de nuevo.");
            }

            const snData = extractPortalData(snJson) || {};
            const snToken = String(snData.snToken || snJson?.res?.snToken || snJson?.data?.snToken || "");
            if (!snToken) throw new Error("El portal no devolvió snToken.");

            const isNew = String(snData.isNew || "") === "1";
            const sn = isNew && snData.sn ? String(snData.sn) : md5(snToken + PORTAL_SALT);

            const activeBody = JSON.stringify({
              authCode: "",
              authVersion: "",
              channel: "default",
              macAddr: "02:00:00:00:00:00",
              matadata: "",
              openNum: 0,
              signdata: "",
              snToken,
              portalCode: PORTAL_CONFIG.portalCode,
              ...baseFields,
              sn
            });

            const actRes = await nativeFetch(`https://${host}/api/portalCore/v8/active`, {
              method: "POST",
              headers,
              body: wrap(activeBody)
            });
            const actJson = await actRes.json();
            const rawAct = JSON.stringify(actJson);
            if (/portal100024|黑名单/i.test(rawAct)) {
              throw new Error("Bloqueo regional en activación (portal100024). Verifica que tu VPN esté conectada.");
            }

            const actData = extractPortalData(actJson) || actJson?.res || actJson?.data || {};
            if (!actData.userId || !actData.userToken) {
              throw new Error("Activación incompleta sin userId/userToken.");
            }

            credencial = {
              userId: String(actData.userId),
              userToken: String(actData.userToken),
              sn,
              snToken
            };
            break;
          } catch (err) {
            ultimoError = err.message || String(err);
            if (/portal100024/i.test(ultimoError)) throw err;
          }
        }

        if (!credencial) {
          throw new Error(ultimoError);
        }

        mostrarMensaje("info", `3/3 Subiendo credencial ${credencial.userId} al Worker...`);

        const donateRes = await nativeFetch(`${WORKER_BASE}/session/donate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(credencial)
        });
        const donateJson = await donateRes.json();

        if (!donateRes.ok || !donateJson?.ok) {
          throw new Error(donateJson?.error || `Worker respondió HTTP ${donateRes.status}`);
        }

        ultimaCredencialGenerada = credencial;
        document.getElementById("last-cred-label").textContent = `ID: ${credencial.userId}`;
        document.getElementById("copy-box").classList.add("show");

        if (Array.isArray(donateJson.activeSessions)) {
          renderizarListaPool(donateJson.activeSessions);
        } else {
          await cargarPoolVigente();
        }

        mostrarMensaje(
          "ok",
          `Listo: credencial ${credencial.userId} cargada al pool (vigencia: ${donateJson.maxAgeHours || 6} horas).`
        );
      } catch (err) {
        mostrarMensaje("err", err.message || "Error al generar o donar credencial.");
      } finally {
        btn.disabled = false;
        btn.textContent = "+ Generar y Donar Credencial Nueva";
      }
    }

    function copiarUltimaCredencial() {
      if (!ultimaCredencialGenerada) return;
      const text = JSON.stringify(ultimaCredencialGenerada, null, 2);
      if (window.AndroidNative && typeof window.AndroidNative.copyText === "function") {
        const ok = window.AndroidNative.copyText("XuperCredencial", text);
        if (ok) {
          mostrarMensaje("info", "Credencial copiada al portapapeles nativo.");
          return;
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => mostrarMensaje("info", "Credencial copiada al portapapeles."))
          .catch(() => {});
      }
    }

    // Carga inicial y actualización automática cada 30 segundos
    cargarPoolVigente();
    setInterval(cargarPoolVigente, 30000);
  </script>
